services:
  mathable_app:
    build: .
    environment:
      NODE_ENV: production
      PORT: "${PORT:-3000}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-mathable}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-mathable}"
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in .env}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
    ports: ["${PORT:-3000}:${PORT:-3000}"]
    depends_on:
      postgres: {condition: service_healthy}
    networks:
      - reseau_interne
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - reseau_interne
    container_name: mathable_db
    # Limites
    mem_limit: 1024m
    cpus: "1.0"

    # Logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    #Labels
    labels:
      glance.hide: true

volumes: {pgdata: {}}

networks:
  reseau_interne:
    external: true