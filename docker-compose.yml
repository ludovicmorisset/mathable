services:
  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: "${PORT}"
      PGHOST: mathable_db
      PGPORT: "5432"
      PGDATABASE: "${POSTGRES_DB:-mathable}"
      PGUSER: "${POSTGRES_USER:-mathable}"
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      SESSION_SECRET: "${SESSION_SECRET}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USER: "${SMTP_USER}"
      SMTP_PASS: "${SMTP_PASSWORD}"
      SMTP_FROM: "${SMTP_FROM}"
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      postgres: {condition: service_healthy}
    container_name: mathable
    
    # Limites
    mem_limit: 1024m
    cpus: "1.0"

    # Logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    #Labels
    labels:
      glance.name: Mathable
      glance.icon: mathable/public/mathable_logo.svg
      glance.url: https://mathable.tessirom.fr
      glance.description: Jeux de plateau
      com.centurylinklabs.watchtower.enable: false
    
    networks:
      - reseau_interne
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - reseau_interne
    container_name: mathable_db
    # Limites
    mem_limit: 1024m
    cpus: "1.0"

    # Logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    #Labels
    labels:
      glance.hide: true

volumes: {pgdata: {}}

networks:
  reseau_interne:
    external: true