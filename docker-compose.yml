services:
  mathable_app:
    build: .
    container_name: mathable_app
    environment:
      NODE_ENV: "${DOCKER_NODE_ENV:-production}"
      PORT: "${PORT:-3000}"
      PGHOST: "${POSTGRES_HOST:-mathable_db}"
      PGPORT: "${POSTGRES_PORT:-5432}"
      PGDATABASE: "${POSTGRES_DB:-mathable}"
      PGUSER: "${POSTGRES_USER:-mathable}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET in .env}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-noreply@example.invalid}"
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      mathable_db:
        condition: service_healthy
    networks:
      - mathable_internal
    mem_limit: "${APP_MEM_LIMIT:-1024m}"
    cpus: "${APP_CPUS:-1.0}"
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"

  mathable_db:
    image: "${POSTGRES_IMAGE:-postgres:16-alpine}"
    container_name: mathable_db
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-mathable}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:-mathable}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mathable_internal
    mem_limit: "${DB_MEM_LIMIT:-1024m}"
    cpus: "${DB_CPUS:-1.0}"
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-3}"

volumes:
  pgdata: {}

networks:
  mathable_internal:
    driver: bridge
